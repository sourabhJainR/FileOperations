name: FileKit CI
on:
  push:
    paths:
      - "apps/filekit/**"
      - ".github/workflows/filekit-ci.yml"
  pull_request:
    paths:
      - "apps/filekit/**"
      - ".github/workflows/filekit-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filekit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/filekit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/filekit/package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify built entry point and static app assets
        run: |
          test -s dist/index.html
          test -s dist/service-worker.js
          test -s dist/manifest.webmanifest
          test -s dist/icons/filekit.svg
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: npm run test:browser
      - name: Upload Playwright failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filekit-playwright-results
          path: apps/filekit/test-results/
          if-no-files-found: ignore
