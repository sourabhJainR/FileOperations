name: FileKit CI
on:
  push:
    paths:
      - "apps/filekit/**"
      - ".github/workflows/filekit-ci.yml"
  pull_request:
    paths:
      - "apps/filekit/**"
      - ".github/workflows/filekit-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filekit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/filekit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/filekit/package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify built entry point
        run: test -s dist/index.html
